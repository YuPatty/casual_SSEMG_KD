model:
  fea: "pha"
  norm: False
  fmamba: True
  dense_channel: 16
  edepth: 3
  mdepth: 3
  pdepth: 3
  compress_factor: 0.5
  num_tscblocks: 1
  sampling_rate: 1000
  # Deployment grid: 256 ms analysis window, 64 ms hop at 1 kHz.
  # The 512/128 Teacher is re-analysed onto this grid inside
  # pipeline_distill_crossarch_v6_256_64.py before response KD.
  n_fft: 256
  hop_size: 64
  win_size: 256
  beta: 1.0
  loss_fn: "time+com+con"
  mr_max_len: 9500
  mask_hp_cut_hz: 150.0
  loss_weights:
    time: 0.25
    com : 0.40
    con : 0.25
    mr  : 0.08
  use_gn: True
  causal: True            # 因果版 student：時間軸只看過去、norm 改逐幀（需重新訓練，不能載入舊的非因果權重）
  causal_time_gn_groups: 1  # TF-ConvBlock 時間軸卷積後的 norm 群數（1 = 逐幀 channel LayerNorm）
  gn_groups: 8
ablation:
  use_mrstft: True
  use_entropy: True
  use_phase: True

metrics:
  sampling_rate:    1000   
  n_fft:            256
  hop_size:         32
  win_size:         128
  segment_sec:      1
